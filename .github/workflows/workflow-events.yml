name: Workflow Events

on:
  push:
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened]

jobs:
  log-event:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Log Trigger Event
        run: echo "Build triggered by ${{ github.event_name }}"
