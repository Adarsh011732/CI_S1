name: using-actions
on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
            - name: Install Dependencies
              run: npm ci
            - name: Run Unit Tests
              run: npm run test


